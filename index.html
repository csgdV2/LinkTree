.g:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.g svg{display:block;width:24px;height:24px;flex:none;fill:currentColor}
.g svg.st{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#ring{display:none}
a,.g{cursor:none}
#arrow{position:fixed;left:-99px;top:-99px;z-index:100;pointer-events:none;transform:translate(-3px,-2px)}
#arrow svg{display:block;width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
#arrow path{fill:#fff;stroke:#0b0c14;stroke-width:1.4;stroke-linejoin:round;transition:fill .2s}

.hrt{position:fixed;z-index:97;pointer-events:none;color:#ff8fb8;font-size:15px;animation:hr .9s ease-out forwards}
@keyframes hr{to{transform:translate(var(--dx),-48px) scale(.6);opacity:0}}
@media (pointer:coarse){body,a,.g{cursor:auto}#cur,#ring,#arrow{display:none}}
@media (prefers-reduced-motion:reduce){.hrt{display:none}#cur.pop svg{animation:none}}
@media (prefers-reduced-motion:reduce){.g{transition:none}}
</style>

<script>
(function(){
